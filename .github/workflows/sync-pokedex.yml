name: Sync Pokédex from PokeAPI

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Refresh catalog on Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl ssh console --config server/fly.toml -C "node dist/scripts/populateDb.js"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
